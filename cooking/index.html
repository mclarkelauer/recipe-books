<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cookbook</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cookbook">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#f7f3ec; --surface:#fffdf8; --text:#26221c; --muted:#8a8175;
  --border:#e7dfd2; --accent:#b3541e; --accent-soft:#f6e3d3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1a17; --surface:#262219; --text:#f0e9db; --muted:#a39a88;
         --border:#3a352b; --accent:#e08a4e; --accent-soft:#3a2a1c; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;}
header{position:sticky; top:0; z-index:10; background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px; border-bottom:1px solid var(--border);}
h1{margin:0; font-size:26px; letter-spacing:-.5px;}
.sub{color:var(--muted); font-size:13px; margin:2px 0 10px;}
.tabs{display:flex; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:3px; margin-bottom:10px;}
.tab{flex:1; border:none; background:none; color:var(--muted); font-size:15px; font-weight:600;
  padding:8px; border-radius:9px; cursor:pointer;}
.tab.active{background:var(--accent); color:#fff;}
.search{width:100%; padding:11px 14px; font-size:16px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface); color:var(--text); outline:none;}
.search:focus{border-color:var(--accent);}
.chips{display:flex; gap:8px; overflow-x:auto; padding:10px 0 4px; scrollbar-width:none; flex-wrap:wrap;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; padding:7px 14px; border-radius:999px; font-size:14px;
  border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
main{padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 30px); max-width:720px; margin:0 auto;}
#finder-panel{padding:14px 18px 0; max-width:720px; margin:0 auto;}
.card{display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--border); border-radius:14px; padding:15px 16px; margin-bottom:12px; cursor:pointer;}
.card h2{margin:0 0 4px; font-size:18px;}
.card p{margin:0; color:var(--muted); font-size:14px;}
.meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:13px; color:var(--muted);}
.tag{background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:2px 9px; font-size:12.5px; font-weight:600;}
.match{font-size:12.5px; font-weight:600; color:var(--accent);}
.empty{text-align:center; color:var(--muted); padding:60px 20px;}
.empty .big{font-size:44px; margin-bottom:12px;}
.back{display:inline-block; margin:2px 0 12px; color:var(--accent); font-size:15px; cursor:pointer; background:none; border:none; padding:0;}
.detail h1{font-size:28px; margin:0 0 4px;}
.detail .desc{color:var(--muted); margin:0 0 12px;}
h3{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:22px 0 8px;}
h3:first-child{margin-top:6px;}
ul.ing{list-style:none; margin:0; padding:0;}
ul.ing li{padding:9px 0; border-bottom:1px solid var(--border); display:flex; gap:10px;}
ul.ing li:last-child{border-bottom:none;}
.amt{flex:0 0 110px; font-weight:600;}
ol.steps{margin:0; padding:0; list-style:none; counter-reset:step;}
ol.steps li{counter-increment:step; padding:10px 0 10px 44px; position:relative; border-bottom:1px solid var(--border);}
ol.steps li:last-child{border-bottom:none;}
ol.steps li::before{content:counter(step); position:absolute; left:0; top:10px;
  width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;}
.notes{background:var(--accent-soft); border-radius:12px; padding:12px 14px; font-size:14.5px; margin-top:6px;}
.src{margin-top:18px; font-size:13px; color:var(--muted);}
.error{text-align:center; color:var(--muted); padding:60px 20px;}
.have-tags{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 0;}
.have-tag{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft);
  color:var(--accent); border-radius:999px; padding:6px 8px 6px 12px; font-size:14px; font-weight:600;}
.have-tag button{border:none; background:none; color:var(--accent); font-size:16px; cursor:pointer; padding:0 2px;}
.hint{font-size:13px; color:var(--muted); margin:6px 0 0;}
</style>
</head>
<body>
<header id="hdr">
  <h1>🍳 Cookbook</h1>
  <div class="sub" id="count"></div>
  <div class="tabs">
    <button class="tab active" id="tab-browse">Browse</button>
    <button class="tab" id="tab-finder">✨ Finder</button>
  </div>
  <div id="browse-controls">
    <input class="search" id="search" type="search" placeholder="Search recipes…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
</header>
<section id="finder-panel" hidden>
  <h3>What are you in the mood for?</h3>
  <div class="chips" id="mood-chips"></div>
  <h3>What do you have to work with?</h3>
  <input class="search" id="have-input" type="text" placeholder="Type ingredients, separated by commas…" autocomplete="off" enterkeyhint="done">
  <p class="hint">Type what’s in the fridge, then hit return.</p>
  <div class="have-tags" id="have-tags"></div>
</section>
<main id="app"></main>
<script>
const JSON_URL = "recipes.json";
let recipes = [], query = "", category = "All";
let view = "browse";
let selMoods = new Set(), haveSet = [];

async function load(){
  try{
    const r = await fetch(JSON_URL, {cache:"no-store"});
    if(!r.ok) throw 0;
    const j = await r.json();
    recipes = j.recipes || [];
  }catch(e){
    document.getElementById("app").innerHTML =
      '<div class="error">Couldn’t load recipes.<br>Check your connection and reopen.</div>';
    return;
  }
  renderChips(); renderMoodChips();
  route();
  window.addEventListener("hashchange", route);
  document.getElementById("search").addEventListener("input", e=>{
    query = e.target.value.toLowerCase(); renderList();
  });
  document.getElementById("tab-browse").onclick = ()=>setView("browse");
  document.getElementById("tab-finder").onclick = ()=>setView("finder");
  document.getElementById("have-input").addEventListener("keydown", e=>{
    if(e.key==="Enter"){ addTyped(); }
  });
}
function setView(v){
  view = v;
  document.getElementById("tab-browse").classList.toggle("active", v==="browse");
  document.getElementById("tab-finder").classList.toggle("active", v==="finder");
  document.getElementById("browse-controls").style.display = v==="browse" ? "" : "none";
  document.getElementById("finder-panel").hidden = v!=="finder";
  if(v==="finder") renderFinder(); else route();
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- browse ---------- */
function categories(){
  const s = new Set(recipes.map(r=>r.category).filter(Boolean));
  return ["All", ...[...s].sort()];
}
function renderChips(){
  document.getElementById("chips").innerHTML = categories().map(c=>
    `<button class="chip${c===category?" active":""}" data-c="${esc(c)}">${esc(c)}</button>`
  ).join("");
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{
    category = b.dataset.c; renderChips(); renderList();
  });
}
function filtered(){
  return recipes.filter(r=>{
    const okC = category==="All" || r.category===category;
    const hay = (r.title+" "+(r.description||"")+" "+
      (r.ingredients||[]).map(i=>i.item).join(" ")).toLowerCase();
    return okC && (!query || hay.includes(query));
  });
}
function renderList(){
  const list = filtered();
  document.getElementById("count").textContent =
    recipes.length ? recipes.length + (recipes.length===1?" recipe":" recipes") : "";
  const app = document.getElementById("app");
  if(!recipes.length){
    app.innerHTML = `<div class="empty"><div class="big">🍳</div>
      <p><strong>No recipes yet.</strong></p>
      <p>Forward a recipe in chat and it will appear here.</p></div>`;
    return;
  }
  if(!list.length){
    app.innerHTML = `<div class="empty"><p>No recipes match your search.</p></div>`;
    return;
  }
  app.innerHTML = list.map(r=>cardHTML(r)).join("");
}
function cardHTML(r, matchLine){
  return `<button class="card" onclick="location.hash='#/r/${r.id}'">
    <h2>${esc(r.title)}</h2>
    ${r.description?`<p>${esc(r.description)}</p>`:""}
    <div class="meta">
      ${r.category?`<span class="tag">${esc(r.category)}</span>`:""}
      ${r.servings?`<span>Serves ${esc(r.servings)}</span>`:""}
      ${r.total_time?`<span>${esc(r.total_time)}</span>`:""}
      ${matchLine?`<span class="match">${matchLine}</span>`:""}
    </div></button>`;
}

/* ---------- finder ---------- */
function allMoods(){
  const s = new Set();
  recipes.forEach(r=>(r.moods||[]).forEach(m=>s.add(m)));
  return [...s].sort();
}
function renderMoodChips(){
  const moods = allMoods();
  document.getElementById("mood-chips").innerHTML = moods.length ? moods.map(m=>
    `<button class="chip${selMoods.has(m)?" active":""}" data-m="${esc(m)}">${esc(m)}</button>`
  ).join("") : `<p class="hint">Moods will appear here once recipes are added.</p>`;
  document.querySelectorAll("#mood-chips .chip").forEach(b=>b.onclick=()=>{
    const m = b.dataset.m;
    selMoods.has(m) ? selMoods.delete(m) : selMoods.add(m);
    renderMoodChips(); renderFinder();
  });
}
function toggleHave(ing){
  ing = ing.toLowerCase();
  haveSet = haveSet.includes(ing) ? haveSet.filter(x=>x!==ing) : [...haveSet, ing];
  renderHaveTags(); renderFinder();
}
function addTyped(){
  const inp = document.getElementById("have-input");
  inp.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(s=>{
    if(!haveSet.includes(s)) haveSet.push(s);
  });
  inp.value = "";
  renderHaveTags(); renderFinder();
}
function renderHaveTags(){
  document.getElementById("have-tags").innerHTML = haveSet.map(h=>
    `<span class="have-tag">${esc(h)}<button onclick="toggleHave('${esc(h)}')">×</button></span>`
  ).join("");
}
function ingMatch(q, itemText){
  q = q.toLowerCase().trim();
  const item = itemText.toLowerCase();
  if(!q) return false;
  return item.includes(q) || q.split(/\s+/).some(w=>w.length>2 && item.includes(w));
}
function scoreRecipe(r){
  const moodHits = (r.moods||[]).filter(m=>selMoods.has(m));
  const ingHits = haveSet.filter(h=>
    (r.ingredients||[]).some(i=>ingMatch(h, i.item)));
  return {moodHits, ingHits, total: moodHits.length*2 + ingHits.length*3};
}
function renderFinder(){
  const app = document.getElementById("app");
  renderHaveTags();
  const scored = recipes.map(r=>({r, s:scoreRecipe(r)}))
    .filter(x=>x.s.total>0)
    .sort((a,b)=>b.s.total-a.s.total || a.r.title.localeCompare(b.r.title));
  let html = "";
  if(!recipes.length){
    html = `<div class="empty"><div class="big">✨</div>
      <p><strong>The Finder is ready.</strong></p>
      <p>Add some recipes and it will match<br>moods and ingredients for you.</p></div>`;
  } else if(!selMoods.size && !haveSet.length){
    html = `<div class="empty"><div class="big">✨</div>
      <p>Pick a mood or type what you have<br>to find a recipe.</p></div>`;
  } else if(!scored.length){
    html = `<div class="empty"><p>Nothing matches that combo.<br>Try fewer picks.</p></div>`;
  } else {
    html = `<p class="hint" style="margin:4px 0 12px">${scored.length} match${scored.length===1?"":"es"}</p>` +
      scored.map(x=>{
        const bits = [];
        if(x.s.moodHits.length) bits.push(x.s.moodHits.join(", "));
        if(x.s.ingHits.length) bits.push("uses " + x.s.ingHits.join(", "));
        return cardHTML(x.r, "✓ " + bits.join(" · "));
      }).join("");
  }
  app.innerHTML = html;
}

/* ---------- detail + routing ---------- */
function renderDetail(id){
  const r = recipes.find(x=>x.id===id);
  const app = document.getElementById("app");
  if(!r){ location.hash = "#/"; return; }
  app.innerHTML = `<div class="detail">
    <button class="back" onclick="history.back()">‹ Back</button>
    <h1>${esc(r.title)}</h1>
    ${r.description?`<p class="desc">${esc(r.description)}</p>`:""}
    <div class="meta" style="margin-bottom:4px">
      ${r.category?`<span class="tag">${esc(r.category)}</span>`:""}
      ${r.servings?`<span>Serves ${esc(r.servings)}</span>`:""}
      ${r.prep_time?`<span>Prep ${esc(r.prep_time)}</span>`:""}
      ${r.cook_time?`<span>Cook ${esc(r.cook_time)}</span>`:""}
      ${(r.moods||[]).map(m=>`<span class="tag">${esc(m)}</span>`).join("")}
    </div>
    <h3>Ingredients</h3>
    <ul class="ing">${(r.ingredients||[]).map(i=>
      `<li><span class="amt">${esc(i.amount||"")}</span><span>${esc(i.item)}</span></li>`).join("")}</ul>
    <h3>Method</h3>
    <ol class="steps">${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${r.notes?`<h3>Notes</h3><div class="notes">${esc(r.notes)}</div>`:""}
    ${r.source?`<div class="src">Source: ${esc(r.source)}</div>`:""}
  </div>`;
  window.scrollTo(0,0);
}
function route(){
  const m = location.hash.match(/^#\/r\/(.+)$/);
  const hdr = document.getElementById("hdr");
  const panel = document.getElementById("finder-panel");
  if(m){
    hdr.style.display = "none";
    panel.hidden = true;
    renderDetail(decodeURIComponent(m[1]));
    return;
  }
  hdr.style.display = "";
  if(view==="finder"){ panel.hidden = false; renderFinder(); }
  else { panel.hidden = true; renderList(); }
}
document.getElementById("tab-browse").onclick = ()=>setView("browse");
document.getElementById("tab-finder").onclick = ()=>setView("finder");
load();
</script>
</body>
</html>
